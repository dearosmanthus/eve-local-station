name: eve_local_station
description: An offline-first Tranquility fitting and star-map companion.
publish_to: none
version: 0.5.0+5

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/catalogue.json
    - assets/data/universe.json
    - assets/data/manifest.json
    - assets/licenses/THIRD_PARTY_NOTICES.txt
    - assets/engine/
